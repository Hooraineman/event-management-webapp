<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Horizon</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎉 Event Horizon</h1>
        <p>Manage and Explore Upcoming Events</p>
    </header>

    <section class="search-section">
        <input
            type="text"
            id="searchInput"
            placeholder="Search by event name or date..."
        >
    </section>

    <section class="events-section">

        <h2>Upcoming Events</h2>

        <div id="eventContainer"></div>

    </section>

    <section class="form-section">

        <h2>Add New Event</h2>

        <div id="warning"></div>

        <form id="eventForm">

            <input
                type="text"
                id="eventName"
                placeholder="Event Name"
            >

            <input
                type="date"
                id="eventDate"
            >

            <textarea
                id="eventDescription"
                placeholder="Event Description"
            ></textarea>

            <button type="submit">
                Add Event
            </button>

        </form>

    </section>

    <footer>
        Hoorain Eman © 2026
    </footer>

    <script src="script.js"></script>

</body>
</html>
